name: A happy path
replies:
  - "Yes, I'm happy to go ahead."
  - "Two years ago I was diagnosed with rheumatoid arthritis. I'm 52 and I used to run a small bakery."
  - "It started with stiff hands in the morning, around March. By autumn I couldn't knead dough any more, and the diagnosis came in November."
  - "Angry at first, then scared. Now a bit of both, and sometimes relief that it has a name."  # EMOTIONS.INVITE
  - "Mostly the fear: of losing the bakery, and of becoming a burden for my family."            # EMOTIONS.DEEPEN
  - "Yes, that sounds like me."                                                                  # EMOTIONS.REFLECT
  - "My hands were my work and my way of showing love, baking for my family. I'm learning who I am without that."
  - "My sister comes on Sundays and my granddaughter helps me. I wish my doctors asked about my life, not only my blood tests."
  - "Yes, that feels right."
